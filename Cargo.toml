[package]
name = "statistical-player"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
directories = "6.0.0"
eframe = "0.37.0"
egui = "0.37.0"
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
toml = "1.1.8"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt", "ansi"] }

[profile.dev]
opt-level = 1

# Dependencies such as the decoder and FFT must be fast even in debug builds,
# otherwise audio stutters while developing.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
strip = true
